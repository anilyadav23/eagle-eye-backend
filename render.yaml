services:
  - type: web
    name: eagle-eye-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: local
      - key: JWT_SECRET_KEY
        generateValue: true
